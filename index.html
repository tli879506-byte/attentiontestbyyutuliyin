<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注意力自测问卷</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #E8000A;
    --blue: #0c1dd6;
    --dark: #1a1a1a;
    --mid: #786e6e;
    --light: #888;
    --border: #ddd;
    --bg: #f7f7f7;
    --card: #ffffff;
  }

  body {
    font-family: "SimSun", "宋体", "STSong", Georgia, serif;
    background: var(--bg);
    color: var(--dark);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ── 主容器 ── */
  #app {
    width: 100%;
    max-width: 640px;
    position: relative;
  }
  
  /* ── 封面 ── */
  #cover {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 56px 40px 48px;
    text-align: center;
  }

  #cover .label {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--light);
    margin-bottom: 32px;
  }

  #cover h1 {
    font-size: 26px;
    font-weight: normal;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  #cover .subtitle {
    font-size: 13px;
    color: var(--mid);
    line-height: 2;
    margin-bottom: 40px;
  }

  #cover .meta {
    font-size: 12px;
    color: var(--light);
    margin-bottom: 32px;
  }

  /* ── 按钮 ── */
  .btn-primary {
    display: inline-block;
    background: var(--dark);
    color: #fff;
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 14px 48px;
    border: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: #333; }

  .btn-restart {
    display: inline-block;
    background: transparent;
    color: var(--mid);
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 10px 32px;
    border: 1px solid var(--border);
    cursor: pointer;
    margin-top: 16px;
    transition: all 0.2s;
  }
  .btn-restart:hover { border-color: var(--mid); color: var(--dark); }

  /* ── 问题卡片 ── */
  #quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 40px 36px 32px;
    display: none;
    position: relative;
    overflow: hidden;
  }

  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .quiz-title {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 13px;
    color: var(--light);
    letter-spacing: 1px;
  }

  .quiz-progress {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 12px;
    color: var(--light);
  }

  .progress-bar-wrap {
    height: 2px;
    background: var(--border);
    margin-bottom: 28px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--dark);
    transition: width 0.4s ease;
  }

  /* 帖子框 */
  .post-box {
    background: #fafafa;
    border-left: 3px solid var(--dark);
    padding: 16px 20px;
    margin-bottom: 24px;
    font-size: 15px;
    line-height: 1.9;
    color: var(--dark);
    position: relative;
  }

  .post-label {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 11px;
    color: var(--light);
    letter-spacing: 2px;
    margin-bottom: 11px;
  }

  .post-text {
    font-size: 15px;
    line-height: 1.9;
  }

  /* 选项 */
  .options-list {
    list-style: none;
    margin-bottom: 11px;
  }

  .option-item {
    border: 1px solid var(--border);
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }

  .option-item:hover {
    border-color: #aaa;
    background: #fafafa;
  }

  .option-inner {
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    font-size: 14px;
    line-height: 1.7;
  }

  .option-label {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 12px;
    color: var(--light);
    min-width: 18px;
    margin-top: 2px;
  }

  .option-text { flex: 1; }

  /* 点赞数 */
  .like-count {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 11px;
    color: var(--light);
    text-align: right;
    padding: 0 16px 10px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .like-count.visible { opacity: 1; }

  .like-icon { font-size: 10px; }

  /* 溢出点赞 */
  .like-overflow {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 13px;
    color: var(--red);
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
  }

  /* ── 事主旁白小字 ── */
  #whisper {
    font-size: 15px;
    color: var(--light);
    font-style: italic;
    margin-top: 4px;
    min-height: 18px;
    transition: opacity 0.4s;
    opacity: 0;
    padding: 0 2px;
  }
  #whisper.visible { opacity: 1; }

  /* ── 弹窗 ── */
  #popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #popup-overlay.show { display: flex !important; }

  #popup-box {
    position: relative;
    max-width: 320px;
    width: 90%;
    text-align: center;
  }
   .popup-layer {
    background: #003cff;
    border: 2px solid var(--card);
    padding: 32px 28px;
    text-align: center;
    animation: popIn 0.2s ease;
    position: relative;
  }

  /* 堆叠弹窗外壳 */
  .popup-stack-wrap {
    position: relative;
    max-width: 320px;
    width: 90%;
  }
  .stack-shadow {
    position: absolute;
    background: #003cff;
    border: 2px solid var(--card);
    width: 100%; height: 100%;
    top: 0; left: 0;
  }
  .stack-shadow.s1 { transform: translate(8px,8px); opacity:0.45; z-index:101; }
  .stack-shadow.s2 { transform: translate(4px,4px); opacity:0.7;  z-index:102; }
  .stack-top {
    position: relative;
    z-index: 103;
    background: #003cff;
    border: 2px solid var(--card);
    padding: 32px 28px;
    animation: popIn 0.2s ease;
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }
  @keyframes popOut {
    from { opacity:1; transform: scale(1); }
    to   { opacity:0; transform: scale(0.9) translate(4px,4px); }
  }

  #popup-text {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 20px;
    color: var(--card);
    font-weight: bold;
    white-space: pre-line;
  }

  #popup-btn, .stack-btn {
    background: #000;
    color: #000;
    border: none;
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 10px 32px;
    cursor: pointer;
    display: block;
    margin: 0 auto;
  }

  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #popup-text {
    font-size: 16px;
    line-height: 1.8;
    margin-bottom: 20px;
    color: var(--card);
  }

  #popup-btn {
    background: var(--card);
    color: #000000;
    border: none;
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 10px 32px;
    cursor: pointer;
  }
  /* ═══════════════════════════════════
   第11题：HAL 9000 / DAISY 月球弹窗
   默认弹窗仍然保持纯蓝色
   ═══════════════════════════════════ */

.moon-popup .stack-top {
  background-color: #003cff;

  /* 蓝白相间的 CRT 边框 */
  border: 3px solid #f5f5f5;
  box-shadow:
    inset 0 0 0 3px #003cff,
    inset 0 7px 0 #f5f5f5,
    inset 0 11px 0 #003cff,
    inset 0 -7px 0 #f5f5f5,
    inset 0 -11px 0 #003cff;

  position: relative;
  isolation: isolate;
  overflow: hidden;
}

/* 月球本体：右下角只露出一部分 */
.moon-popup .stack-top::before {
  content: "";
  position: absolute;

  width: 150px;
  height: 150px;

  right: -78px;
  bottom: -76px;

  border-radius: 50%;

  /* 网点月面 + 像素化的环形阴影 */
  background-color: #f5f5f5;
  background-image:
    radial-gradient(
      circle,
      #003cff 1px,
      transparent 1.5px
    ),
    radial-gradient(
      circle at 30% 35%,
      #003cff 0 8px,
      transparent 9px
    ),
    radial-gradient(
      circle at 65% 55%,
      #003cff 0 13px,
      transparent 14px
    ),
    radial-gradient(
      circle at 38% 72%,
      #003cff 0 5px,
      transparent 6px
    );

  background-size:
    5px 5px,
    100% 100%,
    100% 100%,
    100% 100%;

  border: 2px solid #f5f5f5;
  box-shadow:
    0 0 0 4px #003cff,
    0 0 0 6px #f5f5f5;

  z-index: -1;
  pointer-events: none;
}

/* 细密的 CRT 扫描线 */
.moon-popup .stack-top {
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(255, 255, 255, 0.09) 4px,
    transparent 5px
  );
}

/* 月球不能遮挡二进制文字和按钮 */
.moon-popup #popup-text,
.moon-popup .stack-btn {
  position: relative;
  z-index: 1;
}

/* 后面的两层弹窗继续保持蓝色，
   只加蓝白边框，不显示月球 */
.moon-popup .stack-shadow {
  background: #003cff;
  border: 2px solid #f5f5f5;
}

  /* ── 全屏红底效果 ── */
  #fullscreen-blue {
    position: fixed;
    inset: 0;
    background: var(--blue);
    z-index: 200;
    display: none;
    overflow: hidden;
  }
  #fullscreen-blue.show { display: block; }

  .scroll-text-layer {
    position: absolute;
    inset: 0;
    animation: scrollUp 3s linear;
    white-space: nowrap;
  }

  @keyframes scrollUp {
    from { transform: translateY(100%); }
    to { transform: translateY(-100%); }
  }

  .scroll-text-layer span {
    display: inline-block;
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 18px;
    color: #000;
    opacity: 0.7;
    position: absolute;
    animation: floatAround linear infinite;
  }

  /* ── 半透明红字浮现（图6效果） ── */
  #float-red {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
    display: none;
  }
  #float-red.show { display: block; }

  .float-word {
    position: absolute;
    font-family: "SimHei", "黑体", sans-serif;
    color: var(--red);
    opacity: 0;
    animation: floatFade 5s ease forwards;
    pointer-events: none;
  }

  @keyframes floatFade {
    0% { opacity: 0; transform: translateY(8px); }
    30% { opacity: 0.45; }
    70% { opacity: 0.45; }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  /* ── 抖动效果 ── */
  .shake {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translate(-12px, -4px); }
    40% { transform: translate(12px, 4px); }
    60% { transform: translate(-9px, 3px); }
    80% { transform: translate(9px, -3px); }
  }

  /* 选项变红 */
  .option-item.selected-bad {
  border-color: #fa010148;
  background: #2c0404;
  transition: background 1.4s ease, border-color 1.4s ease;
}
.option-item.selected-bad .option-label { 
  color: #fff;
  transition: color 0.6s ease;
}
.option-item.selected-bad .option-text {
  color: #fff;
  transition: color 0.6s ease;
}

  .option-item.selected-ok {
    border-color: var(--dark);
    background: #f5f5f5;
  }

  /* 信息洪流题 */
  .flood-comments {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }

  .flood-item {
    position: absolute;
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 12px;
    color: #ccc;
    white-space: nowrap;
    animation: drift linear infinite;
  }

  @keyframes drift {
    from { transform: translateX(0); opacity: 0.6; }
    50% { opacity: 0.3; }
    to { transform: translateX(-30px); opacity: 0.6; }
  }

  /* 找到0赞选项的特效 */
  .option-item.zero-like-found {
    border-color: var(--dark);
    box-shadow: 0 0 0 2px var(--dark);
  }

  /* ── 结局页 ── */
  #result-page {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 48px 36px;
    text-align: center;
    display: none;
  }

  .result-badge {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--light);
    margin-bottom: 24px;
  }

  .result-emoji {
    font-size: 48px;
    margin-bottom: 20px;
    display: block;
  }

  .result-title {
    font-size: 24px;
    font-weight: normal;
    color: var(--card);
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .result-type {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 13px;
    color: var(--red);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }

  .result-desc {
    font-size: 14px;
    color: var(--mid);
    line-height: 2;
    margin-bottom: 36px;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  .result-score {
    font-family: "SimHei", "黑体", sans-serif;
    font-size: 12px;
    color: var(--light);
    margin-bottom: 32px;
    padding: 16px;
    border: 1px solid var(--border);
    display: inline-block;
    letter-spacing: 1px;
  }

  /* 结局C：温柔 */
  .result-c .result-title { color: var(--card); }

  /* 隐藏结局D */
  .result-d .result-title { color: var(--mid); font-style: italic; }
  /* ── 隐藏结局D：注视 ── */
  #result-page.result-d {
    background: #000;
    border-color: #000;
    min-height: 60vh;
  }
  .result-d .result-badge,
  .result-d .result-type { color: #a2a1a1; }
  .result-d .result-title { color: #e8e8e8; }
  .result-d .result-desc { color: #999; font-style: italic; }
  .result-d .result-score {
    border-color: #333; color: #e8e8e8; background: transparent;
  }

/* 像素眼睛 */
  /* D结局：注视之眼 */
  .eye-wrapper {
  width: 240px;          /* ← 想大想小只改这一个数 */
  margin: 0 auto 20px;
  }



  /* ── 最终题帖主沉默 ── */
  .silence-overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.92);
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s;
  }
  .silence-overlay.show {
    opacity: 1;
    pointer-events: all;
  }
  .silence-text {
    font-size: 14px;
    color: var(--light);
    text-align: center;
    line-height: 2.5;
    font-style: italic;
  }

  @media (max-width: 480px) {
    #quiz-card, #cover, #result-page { padding: 28px 20px 24px; }
    .post-text { font-size: 14px; }
    .option-inner { font-size: 13px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ══ 封面 ══ -->
  <div id="cover">
    <div class="label">心理健康自测</div>
    <h1 id="cover-title">在这个时代<br>测测你还有没有专注力</h1>
    <p class="subtitle" id="cover-subtitle">
      在这个时代，你能否关注到他人最想表达的东西？<br>
      来测试一下自己在网络时代的阅读与理解能力吧！<br>
      本测试共 15 题，每题选出你认为最合适的回复

    <p class="meta">参考时间：5 分钟内｜本测试结果仅供娱乐</p>

  </div>

  <!-- ══ 题目卡片 ══ -->
  <div id="quiz-card">
    <div class="quiz-header">
      <span class="quiz-title">注意力自测问卷</span>
      <span class="quiz-progress" id="progress-text">第 1 题 / 共 15 题</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>

      <div class="post-text" id="post-content"></div>

    <p style="font-family:'SimHei','黑体',sans-serif;font-size:12px;color:#888;margin-bottom:14px;letter-spacing:1px;">如果你来回复这条帖子，你会：</p>

    <ul class="options-list" id="options-list"></ul>

    <div id="whisper"></div>

    <!-- 信息洪流层（题14用） -->
    <div class="flood-comments" id="flood-layer" style="display:none;"></div>

  <!-- ══ 全屏红底 ══ -->

  <!-- ══ 结局页 ══ -->
  <div id="result-page" style="display:none;"></div>

</div>

function renderQuestion() {
  const q = questions[currentQ];
  waitingNext = false;

  document.getElementById('progress-text').textContent = `第 ${q.id} 题 / 共 15 题`;
  document.getElementById('progress-bar').style.width = `${(q.id / 15) * 100}%`;
  document.getElementById('post-content').textContent = q.post;
  document.getElementById('whisper').textContent = '';
  document.getElementById('whisper').className = '';
  document.getElementById('silence-overlay').className = 'silence-overlay';
  document.getElementById('float-red').className = '';
  document.getElementById('float-red').innerHTML = '';

  // 清除洪流
  if (floodInterval) { clearInterval(floodInterval); floodInterval = null; }
  const fl = document.getElementById('flood-layer');
  fl.style.display = 'none';
  fl.innerHTML = '';

  const list = document.getElementById('options-list');
  list.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const li = document.createElement('li');
    li.className = 'option-item';
    if (q.id === 11 && idx === 3) {
      li.style.fontSize = '130%'; // D选项放大
    }

    const inner = document.createElement('div');
    inner.className = 'option-inner';
    inner.innerHTML = `<span class="option-label">${opt.label}</span><span class="option-text">${opt.text}</span>`;
    li.appendChild(inner);

    // 点赞数
    const likeDiv = document.createElement('div');
    likeDiv.className = 'like-count';
    likeDiv.id = `like-${idx}`;
    if (typeof opt.likes === 'string' || opt.overflow) {
      likeDiv.innerHTML = `<span class="like-icon">👍</span><span class="like-overflow">${opt.likes}</span>`;
    } else {
      likeDiv.innerHTML = `<span class="like-icon">👍</span><span>${Number(opt.likes).toLocaleString()}</span>`;
    }
    li.appendChild(likeDiv);

    li.addEventListener('click', () => handleChoice(idx));
    list.appendChild(li);
  });

  // 信息洪流题预设
  if (q.effect === 'flood') {
    setupFlood(q);
  }
  // 第10题：5秒后浮现隐藏选项
  if (q.id === 10) {
    setTimeout(() => {
      if (currentQ !== 9) return; // 防止玩家已经跳题
      const list = document.getElementById('options-list');
      const li = document.createElement('li');
      li.className = 'option-item';
      li.style.cssText = 'border-style:dashed; opacity:0; transition:opacity 1.2s;';
      li.innerHTML = `<div class="option-inner">
        <span class="option-label">?</span>
        <span class="option-text">也许，你跟这个地方的相处模式，没有要求你必须融入它 </span>
      </div>
      <div class="like-count visible" style="opacity:1;">
        <span class="like-icon">👍</span><span>0</span>
      </div>`;
      list.appendChild(li);
      setTimeout(() => li.style.opacity = '1', 30);
      li.addEventListener('click', () => {
        if (waitingNext) return;
        waitingNext = true;
        foundZero = true;
        hiddenCount++;   // 新增
        li.classList.add('selected-ok');
        const w = document.getElementById('whisper');
        w.textContent = '……是这样。';
        setTimeout(() => w.classList.add('visible'), 300);
        setTimeout(() => nextQuestion(), 2000);
      });
    }, 5000);
  }

  if (q.id === 7) {
    setTimeout(() => {
      if (currentQ !== 6) return; // 防止玩家已经跳题
      const list = document.getElementById('options-list');

        <span class="like-icon">👍</span><span>0</span>
      </div>`;
      list.appendChild(li);
      setTimeout(() => li.style.opacity = '1', 50);
      li.addEventListener('click', () => {
        if (waitingNext) return;
        waitingNext = true;
        foundZero = true;
        hiddenCount++;   // 新增
        li.classList.add('selected-ok');
        const w = document.getElementById('whisper');
        w.textContent = '……谢谢。';
        setTimeout(() => w.classList.add('visible'), 300);

function handleChoice(idx) {
  if (waitingNext) return;
  waitingNext = true;

  const q = questions[currentQ];
  const opt = q.options[idx];
  const isBad = opt.type !== 'ok'&&opt.type !== 'method';
  

  // 标记选项颜色
  const items = document.querySelectorAll('.option-item');
  items.forEach((item, i) => {
    if (i === idx) {
      item.classList.add(isBad ? 'selected-bad' : 'selected-ok');
    }
  });

  // 显示点赞
  items.forEach((item, i) => {
    const lk = document.getElementById(`like-${i}`);
    if (lk) lk.classList.add('visible');
  });

  if (isBad) badCount++;
  if (opt.type === 'method') methodCount += 1;

  // 旁白
  let whisperText = '';
  if (q.whisperAll) {
    whisperText = q.whisper[opt.type] || q.whisper['bad'] || '';
  } else {
    if (opt.type === 'justice') whisperText = q.whisper['justice'] || '';
    else if (opt.type === 'half') whisperText = q.whisper['half'] || '';
    else if (opt.type === 'method') whisperText = q.whisper['method'] || '';
    else if (isBad) whisperText = q.whisper['bad'] || '';
    else whisperText = q.whisper['ok'] || '';
  }

  if (whisperText) {
    const w = document.getElementById('whisper');
    w.textContent = whisperText;
    setTimeout(() => w.classList.add('visible'), 300);
  }

  // 特效分发
  switch(q.effect) {
    case 'popup':
      if ((opt.type === 'bad'|| opt.type === 'method') && q.popup) {
        const text = q.popup[opt.type] || q.popup['bad'] || '';
        if (text) {
          setTimeout(() => showPopup(text, () => nextQuestion()), 600);
          return;
        }
      }
      break;
    case 'stacked-popup':
      if ((opt.type === 'bad' || opt.type === 'justice') && q.popup) {
        // 支持数组（多层不同文字）或字符串（向下兼容）
        const rawText = q.popup[opt.type] || q.popup['bad'] || '';
        const texts = Array.isArray(rawText) ? rawText : [rawText, rawText, rawText];
        const isQ11 = q.id === 11;
        setTimeout(() => showStackedPopup(texts, () => nextQuestion(), isQ11 ? 'moon-popup' : ''), 600);
        if (rawText) {
          setTimeout(() => showStackedPopup(texts, () => nextQuestion()), 600);
          return;
        }
      }
      break;

    case 'silence':
      noAnswerTriggerCount++;
      setTimeout(() => {
        const ov = document.getElementById('silence-overlay');
        document.getElementById('silence-text').textContent = q.silenceText;
        ov.classList.add('show');
        setTimeout(() => {
          ov.classList.remove('show');
          setTimeout(() => nextQuestion(), 600);
        }, 2500);
      }, 500);
      return;
    case 'fullscreen-blue':
      setTimeout(() => showFullscreenBlue(q.redText, () => nextQuestion()), 400);
      return;
    case 'flood':
      if (opt.type === 'zero') {
        foundZero = true;
        items[idx].classList.add('zero-like-found');
        const w = document.getElementById('whisper');
        w.textContent = q.zeroWhisper;
        setTimeout(() => w.classList.add('visible'), 300);
        setTimeout(() => nextQuestion(), 2000);
        return;
      }
      break;
    case 'final-silence':
      setTimeout(() => {
        const w = document.getElementById('whisper');
        w.textContent = q.finalText;
        w.style.color = '#aaa';
        setTimeout(() => w.classList.add('visible'), 100);
        setTimeout(() => showResult(), 3000);
      }, 500);
      return;
  }

  // 浮现红字（题10之后的歪楼）
  if (isBad && currentQ >= 9) {
    setTimeout(() => triggerFloatRed(), 200);
  }

  setTimeout(() => nextQuestion(), isBad ? 2500 : 2400);
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= questions.length) {
    showResult();
  } else {
    renderQuestion();
  }
}


// ──────────────────────────────
//  弹窗（单层）
// ──────────────────────────────
let popupCallback = null;
function showPopup(text, cb) {
  const overlay = document.getElementById('popup-overlay');
  const box = document.getElementById('popup-box');
  box.innerHTML = `
    <div class="popup-layer">
      <div id="popup-text">${text}</div>
      <button id="popup-btn" onclick="closePopup()">继续</button>
    </div>`;
  overlay.classList.add('show');
  popupCallback = cb;
}
function closePopup() {
  document.getElementById('popup-overlay').classList.remove('show');
  document.getElementById('popup-box').innerHTML = '';
  if (popupCallback) { popupCallback(); popupCallback = null; }
}
// ──────────────────────────────
//  堆叠弹窗（三层，点一层消一层）
// ──────────────────────────────
let stackTexts = [];
let stackRemaining = 0;

function showStackedPopup(texts, cb, extraClass = '') {
  const overlay = document.getElementById('popup-overlay');
  const box = document.getElementById('popup-box');
  popupCallback = cb;
  // 统一处理：字符串兼容、不足三条补齐
  if (!Array.isArray(texts)) texts = [texts, texts, texts];
  while (texts.length < 3) texts.push(texts[texts.length - 1]);
  stackTexts = texts;
  stackRemaining = 3;

  box.innerHTML = `
    <div class="popup-stack-wrap" id="stack-wrap">
      <div class="stack-shadow s1" id="shadow-s1"></div>
      <div class="stack-shadow s2" id="shadow-s2"></div>
      <div class="stack-top" id="stack-top">
        <div id="popup-text">${stackTexts[0]}</div>
        <button class="stack-btn" onclick="dismissStackTop()">　</button>
      </div>
    </div>`;
    if (extraClass) {
       document.getElementById('stack-wrap').classList.add(extraClass);
    }
  overlay.classList.add('show');
}

function dismissStackTop() {
  stackRemaining--;

  if (stackRemaining <= 0) {
    // 三层全部点完，关闭弹窗
    document.getElementById('popup-overlay').classList.remove('show');
    document.getElementById('popup-box').innerHTML = '';
    if (popupCallback) { popupCallback(); popupCallback = null; }
    return;
  }

  const top = document.getElementById('stack-top');
  const textEl = document.getElementById('popup-text');

  if (stackRemaining === 2) {
    // 消掉 s2（最外层阴影）
    const s2 = document.getElementById('shadow-s2');
    if (s2) {
      s2.style.animation = 'popOut 0.18s ease forwards';
      setTimeout(() => s2.remove(), 180);
    }
    // 切换到第二条文字
    textEl.textContent = stackTexts[1];
  } else if (stackRemaining === 1) {
    // 消掉 s1
    const s1 = document.getElementById('shadow-s1');
    if (s1) {
      s1.style.animation = 'popOut 0.18s ease forwards';
      setTimeout(() => s1.remove(), 180);
    }
    // 切换到第三条文字
    textEl.textContent = stackTexts[2];
  }

  // 顶层弹一下
  top.style.animation = 'none';
  void top.offsetWidth;
  top.style.animation = 'popIn 0.15s ease';
}

// ──────────────────────────────
//  全屏红底
// ──────────────────────────────
function showFullscreenBlue(text, cb) {
  const el = document.getElementById('fullscreen-blue');
  el.innerHTML = '';
  el.classList.add('show');

  const phrases = text.split('\n');
  const allPhrases = [];
  for (let i = 0; i < 150; i++) {
    allPhrases.push(phrases[i % phrases.length]);
  }
  const symbols = ['&','看好了！！！', '*', '睁大你的眼睛','^', '注意我','!','谁许你这样理解', '@','理解我的表达理解我', '#', '开口前想想你在对谁说什么','$', '难道你不是人类吗','%','人类应该理解人类', '……'];

  allPhrases.forEach((phrase, i) => {
    const span = document.createElement('span');
    span.textContent = i % 1 === 0 ? symbols[i % symbols.length] : phrase;
    span.style.cssText = `
      position:absolute;
      font-family:"SimHei","黑体",sans-serif;
      font-size:${10 + Math.random()*24}px;
      color:#E8000A;
      opacity:${0.3 + Math.random()*0.7};
      left:${Math.random()*95}%;
      top:${Math.random()*200}%;
      white-space:nowrap;
    `;
    el.appendChild(span);
  });

  // 核心大字
  const big = document.createElement('div');
  big.textContent = text.replace('\n', '');
  big.style.cssText = `
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-family:"SimHei","黑体",sans-serif;
    font-size:28px;
    color:#fff;
    animation: shake 0.4s ease infinite;
    font-weight:bold;
    text-align:center;
    line-height:1.6;
    text-shadow:0 0 20px rgba(0,0,0,0.5);
    z-index:10;
    white-space:pre-line;
  `;
  el.appendChild(big);

  setTimeout(() => {
    el.classList.remove('show');
    el.innerHTML = '';
    if (cb) cb();
  }, 5000);
}

          <rect x="465" y="215" width="16" height="16" fill="#fff" />

      `;
      break;
  }
  page.innerHTML = `
    <div class="eye-wrapper">
      ${animationHTML}
    </div>

    <div class="result-title">${e.title || ''}</div>

}

function showResult() {
  document.title = `bad:${badCount} method:${methodCount} hidden:${hiddenCount}`;
  console.log('badCount:', badCount, 'methodCount:', methodCount, 'hiddenCount:', hiddenCount);
   document.getElementById('quiz-card').style.display = 'none';

  let endingKey;
  const HIDDEN_TOTAL = 2; // 游戏中一共有几个隐藏选项，按你实际数量改

// B结局：method满分优先（与bad/ok/隐藏值完全解绑）
  const METHOD_MAX = 5; // 改成你设定的method满分值
  if (methodCount >= METHOD_MAX) {
    endingKey = 'B';
// D结局：bad低于ok + 选中所有隐藏选项
  } else if (badCount < (15 - badCount) && hiddenCount >= HIDDEN_TOTAL) {
    endingKey = 'D';
// A结局：bad高于ok
  } else if (badCount > (15 - badCount)) {
  endingKey = 'A';
// C结局：bad低于ok + 没有选中所有隐藏选项
} else {
    endingKey = 'C';
  }
    lastEndingKey = endingKey;
    const page = document.getElementById('result-page');

  // D结局走眼睛渲染，拦截
  buildEndingPage(page, endingKey);
}


function restartQuiz() {
  // 根据上一局结局改封面
  const variantKey = (lastEndingKey === 'A') ? 'A' : (lastEndingKey === 'D') ? 'D' :  (lastEndingKey === 'C') ? 'C' :  (lastEndingKey === 'B') ? 'B' : 'BC';
  const v = coverVariants[variantKey];
    document.getElementById('cover-title').innerHTML = v.title;
    document.getElementById('cover-subtitle').innerHTML = v.subtitle;

    document.getElementById('result-page').style.display = 'none';
    document.getElementById('quiz-card').style.display = 'none';
    document.getElementById('cover').style.display = 'block';
    currentQ = 0; badCount = 0; foundZero = false; noAnswerTriggerCount = 0;
  const cover = document.getElementById('cover');
  if (lastEndingKey) {
    cover.style.background = '#000';
    cover.style.color = '#fff';
    cover.style.borderColor = '#333';
  } else {
  cover.style.background = '';
  cover.style.color = '';
  cover.style.borderColor = '';
  }
}
